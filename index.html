<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Vibe Brief · 把想法变成产品</title><style>
:root{--bg:#f5f2eb;--ink:#20231f;--muted:#74766e;--line:#dedbd1;--lime:#c7f36b;--card:#fffdf8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 5%,#e3efb9,transparent 30%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC",sans-serif}.app{max-width:1180px;margin:auto;padding:28px 22px 50px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-weight:850;font-size:20px}.brand b{display:inline-grid;place-items:center;background:var(--ink);color:var(--lime);width:34px;height:34px;border-radius:10px;margin-right:9px}.tag{font-size:11px;letter-spacing:2px;color:var(--muted)}.hero{padding:54px 0 34px;max-width:760px}h1{font-size:clamp(38px,6vw,74px);line-height:1;letter-spacing:-4px;margin:0 0 20px}h1 span{color:#657b27}p{color:var(--muted);line-height:1.7}.hero p{font-size:17px;margin:0}.grid{display:grid;grid-template-columns:390px 1fr;gap:22px}.panel,.result{background:#ffffffa8;border:1px solid var(--line);border-radius:22px;padding:24px}.panel h2,.result h2{margin:0 0 16px;font-size:16px}.label{font-size:12px;font-weight:700;display:block;margin:18px 0 8px}.field,textarea,select{width:100%;border:1px solid #d5d2c7;background:var(--card);border-radius:12px;padding:13px;font:inherit;color:var(--ink)}textarea{min-height:142px;resize:vertical}.row{display:flex;gap:10px}.row>*{flex:1}.button{border:1px solid #bfc1b7;background:var(--card);border-radius:11px;padding:12px 15px;font-weight:750;cursor:pointer}.primary{background:var(--ink);color:var(--lime);border-color:var(--ink);width:100%;margin-top:18px}.hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}.result{min-height:500px}.empty{display:grid;place-items:center;min-height:430px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:26px;margin-bottom:10px}.output{display:none}.output.show{display:block}.headline{font-size:28px;font-weight:850;letter-spacing:-1px;margin-bottom:22px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.mini{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;min-height:130px}.mini h3{font-size:12px;color:#657b27;margin:0 0 10px}.mini p{font-size:13px;margin:0;color:var(--ink);line-height:1.7}.flow{margin-top:18px;background:#edf1df;border-radius:15px;padding:16px}.flow b{font-size:12px}.flow div{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{background:var(--ink);color:var(--lime);border-radius:20px;padding:8px 11px;font-size:12px}.footer{margin-top:22px;color:var(--muted);font-size:11px}@media(max-width:800px){.grid{display:flex;flex-direction:column}.result{min-height:0}.empty{min-height:180px}.cards{grid-template-columns:1fr}h1{letter-spacing:-2px}}
</style></head><body><main class="app"><header><div class="brand"><b>✦</b>VIBE BRIEF</div><div class="tag">IDEA → PRODUCT</div></header><section class="hero"><h1>把一句想法，<span>变成一个产品。</span></h1><p>输入你脑中的模糊念头，快速得到可以开始编码的产品 brief。适合做 Vibe Coding 的第一步。</p></section><section class="grid"><aside class="panel"><h2>01 / 你的想法</h2><label class="label" for="idea">产品想法</label><textarea id="idea" placeholder="例如：一个帮助独立开发者每天记录灵感的工具"></textarea><label class="label" for="audience">主要用户</label><input class="field" id="audience" placeholder="例如：独立开发者、设计师"><div class="row"><div><label class="label" for="tone">产品气质</label><select id="tone"><option>轻巧有趣</option><option>专业克制</option><option>温暖陪伴</option><option>大胆实验</option></select></div><div><label class="label" for="platform">首发平台</label><select id="platform"><option>Web</option><option>手机</option><option>桌面端</option></select></div></div><button class="button primary" id="generate">生成产品 Brief ✦</button><div class="hint">本地模板辅助整理，不调用 AI。草稿自动保存在当前浏览器。</div></aside><section class="result"><div class="empty" id="empty"><div><strong>还没有产品 brief</strong>写下一个想法，让它开始长出形状。</div></div><div class="output" id="output"><div class="toolbar"><button class="button" id="download">下载开发需求 .md</button><span id="status" role="status"></span></div><div class="headline" id="headline"></div><div class="cards"><article class="mini"><h3>产品定位</h3><p id="position"></p></article><article class="mini"><h3>首版功能</h3><p id="features"></p></article><article class="mini"><h3>用户价值</h3><p id="value"></p></article><article class="mini"><h3>视觉方向</h3><p id="visual"></p></article></div><div class="flow"><b>建议的第一条用户路径</b><div id="flow"></div></div></div></section></section><div class="footer">VIBE BRIEF / 不替你决定做什么，只帮你更快开始。</div></main><script>
const $=id=>document.getElementById(id);const fields=['idea','audience','tone','platform'];
try{const draft=JSON.parse(localStorage.getItem('vibe-brief')||'{}');fields.forEach(k=>{if(draft[k])$(k).value=draft[k]})}catch{}
fields.forEach(k=>$(k).addEventListener('input',()=>{try{localStorage.setItem('vibe-brief',JSON.stringify(Object.fromEntries(fields.map(k=>[k,$(k).value]))))}catch{}}));
let brief='';$('generate').onclick=()=>{const idea=$('idea').value.trim();if(!idea){$('idea').setCustomValidity('先写下一句产品想法');$('idea').reportValidity();return}$('idea').setCustomValidity('');const audience=$('audience').value.trim()||'目标用户（待验证）',tone=$('tone').value,platform=$('platform').value;
const templates=[[/记录|日记|灵感|笔记/,['快速记录内容','标签分类与搜索','编辑与删除记录','本地保存与导出'],['创建第一条记录','添加标签','检索与编辑','导出备份']], [/任务|待办|习惯|打卡/,['创建任务与日期','完成状态切换','按状态筛选','进度统计'],['添加一个任务','设定日期','标记完成','查看进度']], [/图片|照片|封面|海报|设计/,['上传素材','调整文字与布局','即时预览','导出图片'],['选择素材','编辑内容','预览效果','下载图片']], [/学习|单词|背诵|复习/,['添加学习内容','安排复习','练习与反馈','查看学习记录'],['添加学习目标','开始练习','查看反馈','安排复习']]];
const match=templates.find(t=>t[0].test(idea));const features=match?match[1]:['创建核心内容','编辑与预览','保存结果','导出备份'];const steps=match?match[2]:['输入目标','完成核心操作','确认结果','保存或导出'];
const themes={'轻巧有趣':'米白底色、荧光绿主按钮、圆角卡片与轻量反馈。','专业克制':'冷灰底色、深蓝强调色、紧凑的信息层级与清晰表单。','温暖陪伴':'暖白底色、陶土色强调、柔和圆角与鼓励式反馈。','大胆实验':'深色底色、高对比亮色、大字号与富有节奏的排版。'};
$('empty').style.display='none';$('output').classList.add('show');$('headline').textContent=idea;$('position').textContent=`为${audience}提供${platform}端的「${idea}」。以下为首版建议，需要结合真实用户反馈调整。`;$('features').textContent=features.join(' · ');$('value').textContent='首版验证目标：让新用户无需指导完成一次核心操作。记录完成率与卡住的位置，再决定下一步功能。';$('visual').textContent=themes[tone]+(platform==='手机'?'优先单列布局和触控操作。':'优先清晰工作区与键盘操作。');$('flow').replaceChildren(...steps.map((v,i)=>{let e=document.createElement('span');e.className='chip';e.textContent=`${i+1}. ${v}`;return e}));
brief=`# ${idea}\n\n## 产品定位\n${$('position').textContent}\n\n## 首版功能\n${features.map(v=>'- '+v).join('\n')}\n\n## 用户流程\n${steps.join(' → ')}\n\n## 视觉方向\n${$('visual').textContent}\n\n## 验证目标\n${$('value').textContent}\n\n## 实现要求\n- 优先实现一个完整核心流程\n- 包含空状态、输入校验和错误反馈\n- 适配手机与桌面屏幕\n- 为保存与删除提供明确反馈\n\n## 待确认\n- 用户当前用什么解决这个问题？\n- 哪一步最耗时？\n- 数据保存在本地还是需要跨设备同步？\n\n> 本文件由本地模板整理，不是 AI 研究结论。\n`;
};$('idea').addEventListener('input',()=>$('idea').setCustomValidity(''));$('download').onclick=()=>{const u=URL.createObjectURL(new Blob([brief],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='product-brief.md';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);$('status').textContent='已导出'};
</script></body></html>
